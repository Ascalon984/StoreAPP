# 📋 Implementation Plan — Halaman Favorit
### Palugada Store · Mobile App

---

## 1. Design Direction

Halaman Favorit dirancang dengan pendekatan **"Curated Collection"** — bersih, matang, dan profesional, selaras dengan identitas visual Palugada Store yang sudah ada (hijau tua `#1A5C3A`, aksen oranye, background putih bersih).

**Tone:** Refined minimalist — generous whitespace, tipografi tegas, hierarchy yang jelas.  
**Diferensiasi:** Berbeda dari halaman lain yang lebih transaksional, halaman Favorit terasa lebih personal dan kuratorial — seperti *wishlist* yang dirawat, bukan sekadar daftar produk.

---

## 2. Color & Typography Tokens

| Token | Value | Keterangan |
|---|---|---|
| `--primary` | `#1A5C3A` | Hijau utama (konsisten dengan app) |
| `--primary-light` | `#E8F5EE` | Background chip / badge |
| `--accent` | `#E07B2A` | Oranye aksen (harga, CTA sekunder) |
| `--text-primary` | `#1A1A1A` | Judul produk |
| `--text-secondary` | `#6B7280` | Subtitle, metadata |
| `--surface` | `#FFFFFF` | Card background |
| `--bg` | `#F5F7F5` | Page background (sedikit hijau-abu) |
| `--border` | `#E5E7EB` | Garis pemisah halus |
| `--danger` | `#EF4444` | Tombol hapus favorit |

**Font:** Gunakan font yang sudah dipakai app (system font / sesuaikan). Berat `500` untuk label, `700` untuk harga dan judul section.

