## 4. Komponen Detail

### 4.1 Header
- Back arrow (`←`) di kiri
- Judul **"Favorit Saya"** — font bold, center atau kiri
- Tombol **"Edit"** di kanan: mode edit memunculkan checkbox pada setiap card untuk hapus massal
- Background putih, shadow tipis `0 1px 0 #E5E7EB`

---

### 4.2 Summary Bar
- Teks ringkas: `"8 produk tersimpan"` — font kecil, warna `--text-secondary`
- **Filter Chips** horizontal scrollable:
  - `Semua` · `Snack` · `Minuman` · `Kebutuhan` · `Alat Tulis`
  - Chip aktif: background `--primary`, teks putih, border-radius pill
  - Chip nonaktif: background `--primary-light`, teks `--primary`
  - Tidak ada shadow berlebihan — flat dan bersih

---

### 4.3 Product Card (Grid 2 kolom)

```
┌─────────────────────┐
│  [Gambar Produk]    │  ← aspect-ratio 1:1, rounded-lg, bg kuning (sesuai app)
│                     │
│  ♥  (pojok kanan)   │  ← tombol unfavorit, icon heart filled merah
├─────────────────────┤
│  Chitato BBQ 68g    │  ← nama produk, 2 baris max, font-weight 600
│  Rp 15.000          │  ← harga, warna --accent, bold
│  ~~Rp 18.000~~      │  ← harga asli dicoret, kecil, --text-secondary
│  [+ Keranjang]      │  ← CTA, bg --primary, teks putih, rounded-full
└─────────────────────┘
```

**Spesifikasi Card:**
- Border-radius: `16px`
- Shadow: `0 2px 8px rgba(0,0,0,0.06)` — subtle, tidak berat
- Background: `--surface` (`#FFFFFF`)
- Padding dalam: `12px`
- Gap antar card: `12px`
- Image container: background `#FFC107` (kuning, sesuai brand produk existing)

**Badge / Label (opsional):**
- Diskon: chip kecil `"-17%"` merah di pojok kiri atas gambar
- HOT: chip oranye kecil `"🔥 HOT"` jika relevan

---

### 4.4 Empty State
Tampil ketika belum ada produk difavoritkan.

```
┌──────────────────────────────────┐
│                                  │
│         🤍  (ilustrasi SVG)      │
│                                  │
│    Belum ada produk favorit      │  ← font bold, --text-primary
│  Tambahkan produk yang kamu      │
│  suka untuk disimpan di sini     │  ← font reguler, --text-secondary
│                                  │
│     [ Jelajahi Produk  →  ]      │  ← CTA button --primary
│                                  │
└──────────────────────────────────┘
```

---

### 4.5 Edit Mode (Hapus Massal)
Aktif saat user menekan tombol **"Edit"** di header.

- Setiap card menampilkan **checkbox** di pojok kiri atas
- Header berubah: `"Pilih item"` + tombol **"Hapus (N)"** berwarna merah
- Tombol **"Batal"** menggantikan tombol "Edit"
- Animasi masuk checkbox: slide-in halus dari kiri

---

## 5. Interaksi & State

| Aksi | Feedback |
|---|---|
| Tap icon ♥ (unfavorit) | Heart berubah outline, card hilang dengan animasi fade+scale-down |
| Tap `+ Keranjang` | Animasi bounce kecil pada icon cart di bottom nav, snackbar `"Ditambahkan ke keranjang"` |
| Tap card (bukan CTA) | Navigasi ke halaman detail produk |
| Pull-to-refresh | Refresh list favorit dari server |
| Filter chip aktif | List di-filter dengan animasi crossfade halus |
| Edit → Hapus | Konfirmasi bottom sheet: `"Hapus N produk dari favorit?"` + tombol konfirmasi merah |

---

## 6. Layout Responsif

| Kondisi | Perilaku |
|---|---|
| Default (≤ 390px) | Grid 2 kolom |
| Layar kecil (≤ 320px) | Grid 1 kolom (fallback) |
| Mode landscape | Grid 3 kolom, padding horizontal bertambah |

---

## 7. Urutan Konten & Sorting

Default: produk diurutkan berdasarkan **waktu ditambahkan** (terbaru di atas).

Opsional (future): tambahkan dropdown sort kecil:
- Terbaru Ditambahkan
- Harga Terendah
- Harga Tertinggi
- Nama A–Z

---

## 8. Aksesibilitas

- Semua tombol memiliki `aria-label` deskriptif (contoh: `"Hapus Chitato BBQ dari favorit"`)
- Kontras warna memenuhi WCAG AA (rasio ≥ 4.5:1)
- Touch target minimum `44×44px` untuk semua elemen interaktif
- Nama produk dibatasi 2 baris dengan `ellipsis` untuk keterbacaan

---

## 9. Konsistensi dengan Halaman Lain

| Elemen | Referensi Halaman Lain | Favorit |
|---|---|---|
| Bottom Nav | ✅ Sama (Home, Pesanan, Cart, Favorit, Profil) | Favorit tab aktif (icon filled) |
| Warna primer | `#1A5C3A` | ✅ Konsisten |
| Card produk | Mirip dengan produk di Home | Versi sedikit lebih besar, tanpa badge HOT kecuali relevan |
| CTA Button | Rounded, bg --primary | ✅ Konsisten |
| Filter chips | Mirip dengan tab Popular/Hemat/Terbaru di Home | Disesuaikan per kategori |

---

## 10. File & Komponen yang Perlu Dibuat

```
pages/
  FavoritPage.jsx          ← halaman utama

components/favorit/
  FavoritHeader.jsx        ← header dengan tombol Edit
  FavoritSummaryBar.jsx    ← ringkasan + filter chips
  FavoritProductCard.jsx   ← card produk (extends ProductCard)
  FavoritEmptyState.jsx    ← empty state ilustrasi
  FavoritEditToolbar.jsx   ← toolbar saat mode edit aktif

hooks/
  useFavorit.js            ← state management (fetch, remove, filter)

constants/
  favoritCategories.js     ← daftar kategori untuk filter chips
```

---

*Dokumen ini adalah implementation plan awal. Detail visual akhir dapat menyesuaikan dengan design system dan design token yang sudah tersentralisasi di project.*




