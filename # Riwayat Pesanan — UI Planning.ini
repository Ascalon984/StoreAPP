# Quick Chat Berdasarkan Status Pesanan

Quick chat berubah sesuai status order agar client langsung diarahkan ke intent paling relevan.

---

## A. Pending

Untuk:

* konfirmasi pembayaran
* masalah pembayaran
* pembatalan

```ts id="j3j0r8"
[
  'Konfirmasi pembayaran',
  'Pembayaran gagal',
  'Batas pembayaran',
  'Batalkan pesanan'
]
```

---

## B. Processing

Untuk:

* progress pesanan
* keterlambatan
* perubahan alamat

```ts id="l0x7k3"
[
  'Pesanan saya dimana?',
  'Kapan pesanan diproses?',
  'Bisa ubah alamat?',
  'Pesanan belum sampai'
]
```

---

## C. Completed

Untuk:

* komplain produk
* pengembalian
* barang bermasalah

```ts id="zj4k9m"
[
  'Produk tidak sesuai',
  'Ajukan pengembalian',
  'Produk rusak',
  'Barang kurang'
]
```

---

# UX Notes

## Quick chat bukan menu

Quick chat hanyalah:

* suggestion
* shortcut conversation
* bantuan mengetik cepat

Bukan:

* tombol action
* navigasi
* FAQ page

---

# Final UX Direction

Chat tetap terasa:

✅ ringan
✅ cepat
✅ contextual
✅ support-oriented
✅ tidak terlalu kompleks

sesuai karakter app:

* compact
* utility-first
* minimal commerce UI
