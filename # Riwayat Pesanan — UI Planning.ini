# Contextual Quick Chat

## Prinsip UX

Quick chat digunakan untuk membantu client memulai percakapan lebih cepat tanpa harus mengetik manual.

Behavior:

* tap chip → teks masuk ke input
* client masih bisa edit sebelum kirim
* bukan auto-send
* chips hanya suggestion conversation

---

# 1. Profile Chat

## Source

```text id="rn6lrp"
/chat?source=profile
```

## Tujuan

General support:

* bantuan umum
* pembayaran
* layanan
* akun

---

