# Riwayat Pesanan — UI Planning

## Design Language Reference
Mengikuti DNA visual yang sudah ada:
- Palette: emerald-700/800 (primary), amber/orange (accent), gray-50/80 (background)
- Card: `rounded-2xl shadow-layer-xs border border-gray-100/80`
- Typography: font-black untuk angka/judul, font-semibold untuk label, font-medium untuk body
- Section label: `text-[15px] font-bold text-gray-900` di luar card (bukan di dalam header card)
- No header di dalam card — label section berdiri sendiri di atas card

---

## Layout Struktur Halaman

```
┌─────────────────────────────────┐
│  HEADER STICKY                  │  ← "Riwayat Pesanan", minimal, no back button
├─────────────────────────────────┤
│  STATUS FILTER TABS             │  ← Semua / Proses / Selesai / Dibatalkan
├─────────────────────────────────┤
│  SCROLLABLE LIST                │
│  ┌───────────────────────────┐  │
│  │  ORDER CARD               │  │  ← repeating unit
│  └───────────────────────────┘  │
│  ┌───────────────────────────┐  │
│  │  ORDER CARD               │  │
│  └───────────────────────────┘  │
│  ...                            │
├─────────────────────────────────┤
│  BOTTOM NAV                     │
└─────────────────────────────────┘
```

---

## 1. Header

Tidak ada back button — ini halaman root dari bottom nav.
Tidak ada icon tambahan di kanan — halaman ini informatif, bukan aksi.

```
RIWAYAT PESANAN          ← text-[13px] font-bold tracking-[0.15em] uppercase
```

Style konsisten dengan header checkout:
```tsx
<div className="sticky top-0 z-40 bg-white border-b border-gray-100
  px-4 py-3 shadow-layer-xs">
  <h1 className="text-[13px] font-bold text-gray-900 tracking-[0.15em] uppercase">
    Riwayat Pesanan
  </h1>
</div>
```

---

## 2. Status Filter Tabs

Horizontal scroll tabs — bukan dropdown. Lebih accessible dan visual di mobile.

```
[ Semua ]  [ Diproses ]  [ Selesai ]  [ Dibatalkan ]
```

- Tab aktif: `bg-emerald-700 text-white rounded-full px-4 py-1.5 text-[12px] font-bold`
- Tab inaktif: `bg-gray-100 text-gray-500 rounded-full px-4 py-1.5 text-[12px] font-medium`
- Container: `flex gap-2 px-4 py-3 overflow-x-auto scrollbar-none`
- Sticky di bawah header: `sticky top-[44px] z-30 bg-white border-b border-gray-50`

**Status mapping:**
- `Semua` → semua order
- `Diproses` → status: pending/processing
- `Selesai` → status: completed
- `Dibatalkan` → status: cancelled

---

## 3. Order Card

Unit terkecil yang repeating. Satu card = satu order (bisa berisi beberapa item).

### Anatomy Card:

```
┌──────────────────────────────────────────┐
│  #ORD-2024-001          [ Selesai ✓ ]   │  ← order ID + status badge
│  12 Jan 2024 · 14:32                     │  ← timestamp
├──────────────────────────────────────────┤
│  [img] Chitato Beef Barbeque 68g   x2   │  ← product row
│  [img] Aqua 600ml                  x1   │  ← jika multi item
│        +2 produk lainnya                │  ← jika > 2 item, collapse
├──────────────────────────────────────────┤
│  Total: Rp 45.000        [ Beli Lagi ]  │  ← footer card
└──────────────────────────────────────────┘
```

### Status Badge Colors:
- `Diproses` → `bg-amber-50 text-amber-700 border border-amber-200`
- `Selesai` → `bg-emerald-50 text-emerald-700 border border-emerald-200`
- `Dibatalkan` → `bg-red-50 text-red-500 border border-red-200`
- `Menunggu` → `bg-gray-100 text-gray-500 border border-gray-200`

### CTA per Status:
- Selesai → `[ Beli Lagi ]` (primary, emerald) + `[ Beri Ulasan ]` (secondary, ghost)
- Diproses → `[ Lacak Pesanan ]` (primary, emerald)
- Dibatalkan → `[ Beli Lagi ]` (primary, emerald)
- Menunggu → `[ Bayar Sekarang ]` (primary, amber/orange — beda warna karena urgensi)

### Card Style:
```tsx
<div className="mx-3 bg-white rounded-2xl shadow-layer-xs
  border border-gray-100/80 overflow-hidden">
```

---

## 4. Empty State

Tampil saat tidak ada order di tab yang dipilih.

```
        📦
   Belum ada pesanan
   Yuk mulai belanja produk
   favoritmu sekarang!

   [ Mulai Belanja ]
```

- Icon: ilustrasi sederhana atau emoji besar
- Judul: `text-[15px] font-bold text-gray-800`
- Subtitle: `text-[12px] text-gray-400 font-medium`
- CTA: emerald, navigasi ke home

---

## 5. Loading State

Skeleton per card — bukan spinner global.

```
┌──────────────────────────────────┐
│  ████████████      ████████     │  ← skeleton order ID + badge
│  ██████████                     │  ← skeleton timestamp
├──────────────────────────────────┤
│  [  ] ████████████████████  ██  │  ← skeleton product row
├──────────────────────────────────┤
│  ████████████         ████████  │  ← skeleton total + CTA
└──────────────────────────────────┘
```

Gunakan `animate-pulse bg-gray-100 rounded-lg` untuk setiap elemen skeleton.

---

## 6. Detail Order (tap card)

Tap card → navigasi ke `/orders/[id]` atau slide-up sheet.

**Rekomendasi: slide-up bottom sheet** (bukan navigasi halaman baru) — lebih cepat dan tidak butuh back navigation.

Konten detail:
- Info penerima (nama, telepon, alamat)
- Timeline status pesanan (ordered → processing → shipped → delivered)
- List produk lengkap dengan harga satuan
- Metode pembayaran
- Ringkasan biaya (subtotal, ongkir jika ada, total)

---

## 7. Urutan Vertikal Halaman

```
1. Header sticky ("RIWAYAT PESANAN")
2. Filter tabs sticky (Semua / Diproses / Selesai / Dibatalkan)
3. List order cards (scroll)
   - Section label tanggal jika digroup by date (opsional fase 2)
   - Order card x N
4. Empty state (jika tidak ada data)
5. pb-[75px] untuk BottomNav clearance
```

---

## 8. Data Shape (untuk disambungkan ke API)

```typescript
type OrderStatus = 'pending' | 'processing' | 'completed' | 'cancelled';

type OrderItem = {
  productId: string;
  name: string;
  image: string | null;
  price: number;
  quantity: number;
};

type Order = {
  id: string;
  orderId: string;          // display: #ORD-2024-001
  createdAt: string;        // ISO date
  status: OrderStatus;
  items: OrderItem[];
  total: number;
  paymentMethod: string;
  customerName: string;
  phone: string;
  address: string;
};
```

---

## 9. Yang Tidak Perlu di MVP

- Pagination / infinite scroll → cukup load semua, lazy load fase 2
- Search order → tidak perlu di MVP
- Filter by date range → tidak perlu di MVP
- Push notification pesanan → implementasi terpisah
- Rating/review inline di card → navigasi ke modal terpisah




Gunakan Konsep Horizontal Stacked Product (Gaya Aplikasi Premium):Alih-alih menyusun nama produk ke bawah, tampilkan foto/ikon produk secara horizontal berjajar ke kanan (seperti tumpukan kartu atau avatar group).Teks di sebelahnya cukup tertulis: "Chitato Beef & 1 produk lainnya". Ini akan memangkas tinggi kartu secara drastis, membuat halaman sangat rapi, dan memberikan kesan kustom yang kuat.Ubah Gaya Tombol Aksi Utama:Ganti tombol "Beli Lagi" yang berwarna hijau solid menjadi gaya border outline tipis.Ubah tombol "Ulasan" menjadi teks tanpa kotak dengan tanda panah (contoh: Beri Ulasan →). Langkah ini akan langsung melenyapkan kesan visual template belanja konvensional.

